<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 550" role="img" aria-labelledby="title desc"><title id="title">SAADI: build once, retrieve many times</title><desc id="desc">Indexing processes chunks with recalled memory and hierarchical history to build a reusable index. At query time, text, linked entity records and covering L1 summaries contribute scores, fused into one ranking of original passages without an LLM call.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#7596bd" stroke-width="1.3" /></marker></defs><rect width="1160" height="550" fill="#fbfcfe" /><g>
<text class="eyebrow" x="30" y="44" font-family="Arial, sans-serif" fill="#376ec6" font-size="14px" font-weight="600" letter-spacing="2px">(a) INDEXING</text><text class="title" x="30" y="91" font-family="Georgia,serif" fill="#173b70" font-size="32px" letter-spacing="-.6px">Build understanding once.</text>
<text class="note" x="30" y="121" font-family="Arial, sans-serif" fill="#60758d" font-size="15px">One sequential pass through the document.</text>
<rect class="box" x="30" y="160" width="168" height="82" rx="9" fill="#f0f5fc" stroke="#cbdbee" stroke-width="1" />
<rect x="44" y="178" width="20" height="29" rx="2" fill="white" stroke="#9cb7d8" /><path d="M49 186 H59 M49 191 H59 M49 196 H56" stroke="#9cb7d8" />
<text class="label" x="76" y="193" font-family="Arial, sans-serif" fill="#173b70" font-size="18px" font-weight="600">Current</text><text class="label" x="76" y="217" font-family="Arial, sans-serif" fill="#173b70" font-size="18px" font-weight="600">chunk</text>
<path class="wire" d="M200 201 H266" fill="none" stroke="#7596bd" stroke-width="1.6" />
<polyline points="260.0,197.0 266.0,201.0 260.0,205.0" fill="none" stroke="#7596bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="274" y="160" width="256" height="82" rx="9" fill="#173b70" />
<text class="label white" text-anchor="middle" x="402" y="194" font-family="Arial, sans-serif" fill="white" font-size="18px" font-weight="600">Read + update</text><text x="402" y="219" text-anchor="middle" font-size="15" style="fill:#d5e3f5" font-family="Arial, sans-serif" fill="#d5e3f5">One LLM call per chunk</text>
<path class="wire" d="M370 244 V282 H155 V321" fill="none" stroke="#7596bd" stroke-width="1.6" /><polyline points="151.0,315.0 155.0,321.0 159.0,315.0" fill="none" stroke="#7596bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path class="wire" d="M436 244 V321" fill="none" stroke="#7596bd" stroke-width="1.6" />
