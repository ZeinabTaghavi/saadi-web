<rect class="box" x="202" y="242" width="156" height="76" rx="8" fill="#f0f5fc" stroke="#cbdbee" stroke-width="1" /><text class="label" x="280" y="274" text-anchor="middle" font-family="Arial, sans-serif" fill="#173b70" font-size="18px" font-weight="600">Linked memory</text><text class="small" x="280" y="299" text-anchor="middle" font-family="Arial, sans-serif" fill="#60758d" font-size="13px">Memory score</text>
