<text class="eyebrow" x="30" y="44" font-family="Arial, sans-serif" fill="#376ec6" font-size="14px" font-weight="600" letter-spacing="2px">(b) QUERY TIME</text><text class="title" x="30" y="91" font-family="Georgia,serif" fill="#173b70" font-size="32px" letter-spacing="-.6px">Reuse it for every query.</text>
<text class="note" x="30" y="121" font-family="Arial, sans-serif" fill="#60758d" font-size="15px">Use a sparse or dense retriever.</text>
