<rect class="box" x="30" y="326" width="236" height="113" rx="9" fill="#f0f5fc" stroke="#cbdbee" stroke-width="1" />
<circle cx="55" cy="352" r="7" fill="#376ec6" /><circle cx="72" cy="366" r="5" fill="#9cb7d8" /><circle cx="82" cy="349" r="4" fill="#b9cde7" />
<text class="label" x="46" y="397" font-family="Arial, sans-serif" fill="#173b70" font-size="18px" font-weight="600">Entity memory</text><text class="small" x="46" y="420" font-family="Arial, sans-serif" fill="#60758d" font-size="13px">Names · aliases · descriptions</text>
