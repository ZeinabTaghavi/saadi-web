<polyline points="398.0,149.0 402.0,155.0 406.0,149.0" fill="none" stroke="#7596bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M407 441 V451" fill="none" stroke="#7596bd" stroke-width="1.6" stroke-dasharray="4 4" /><text class="small" text-anchor="middle" x="280" y="470" font-family="Arial, sans-serif" fill="#60758d" font-size="13px">Recall memory + history for the next chunk</text>
