<text class="label" x="300" y="397" font-family="Arial, sans-serif" fill="#173b70" font-size="18px" font-weight="600">Summary hierarchy</text><text class="small" x="300" y="420" font-family="Arial, sans-serif" fill="#60758d" font-size="13px">Every 5 units → one summary</text>
